name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml spotless:check test package
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run format:check && npm run lint && npm test && npm run build
      - run: python3 scripts/test-config.py && python3 scripts/release-check.py
      - name: Fresh Compose deployment and HTTP acceptance
        run: |
          python3 scripts/init-env.py
          docker compose -p talkdesk-ci config --quiet
          docker compose -p talkdesk-ci up -d --build --wait --wait-timeout 300
          python3 -m venv .venv
          .venv/bin/pip install -r scripts/requirements-quality.txt
          .venv/bin/python scripts/quality.py
      - if: always()
        run: docker compose -p talkdesk-ci down -v
      - run: git diff --check
